
name: Daily Currency Scraper

on:
  schedule:
    - cron: "0 7 * * *"   # Every day at 10:00 AM Tanzania time (UTC+3)

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # Install dependencies
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run scraper
      - name: Run currency scraper
        run: |
          python -u scraper.py

      # Verify generated CSV
      - name: Verify scraper output
        run: |
          if [ ! -f BOT_exchange_rate.csv ]; then
            echo "ERROR: CSV file was not generated!"
            exit 1
          fi

          echo "CSV file generated successfully."
          ls -lh BOT_exchange_rate.csv

      # Commit updated data
      - name: Save results to GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add BOT_exchange_rate.csv

          git commit -m "Auto update BOT currency exchange data" || {
            echo "No new changes to commit."
          }

          git push

      # Execution summary
      - name: Execution summary
        if: always()
        run: |
          echo "### BOT Currency Scraper Execution" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "Status: Check the job result above." >> $GITHUB_STEP_SUMMARY
